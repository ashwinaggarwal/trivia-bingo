<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Shelf — Lobby</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/engine-lobby.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <a class="back-link" href="/">← Game Shelf</a>
        <h1 id="engine-title" class="h-display">Loading…</h1>
        <p id="engine-tagline" class="subtitle"></p>
      </header>

      <section id="packs-panel">
        <div class="shelf-head">
          <h2 class="h-display">Pick a game</h2>
        </div>
        <div id="packs-grid" class="shelf-grid"></div>
      </section>

      <section id="games-panel" class="card">
        <h2 class="h-display">Existing games</h2>
        <ul id="games-list"></ul>
        <p id="empty-note" class="hidden">No games yet — pick one above to create one.</p>
      </section>
    </div>

    <script src="/shared/engine-lobby.js"></script>
  </body>
</html>
