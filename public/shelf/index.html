<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Shelf</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <p class="eyebrow">Local-network party games</p>
        <h1 class="h-display">Pick something to play</h1>
        <p class="sub">
          No installs, no accounts — create a game below, then put the join link or QR code in front
          of your players.
        </p>
        <a class="join-link" href="/user/join">🙋 Already have a game code? Join here →</a>
      </header>

      <section class="shelf">
        <div class="shelf-head">
          <h2 class="h-display">The shelf</h2>
        </div>
        <div id="shelf-grid" class="shelf-grid"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
