<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Movie Quiz — Player</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1 class="h-display">🍿 Emoji Movie Quiz</h1>
      </header>

      <section id="register-screen">
        <div id="game-id-banner"></div>
        <p>Enter your name to join:</p>
        <form id="register-form">
          <input id="name-input" type="text" placeholder="Your name" maxlength="40" required />
          <button type="submit" class="btn-primary">Join Game</button>
        </form>
        <p id="register-error" class="error"></p>
      </section>

      <section id="game-screen" class="hidden">
        <div id="player-name-banner"></div>
        <div id="score-banner"></div>

        <div id="question-banner" class="hidden">
          <div id="question-status"></div>
          <div id="countdown-text" class="hidden"></div>
          <div id="emoji-text"></div>
        </div>

        <div id="options" class="hidden"></div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
