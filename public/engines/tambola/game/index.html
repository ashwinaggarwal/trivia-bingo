<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambola — Game Screen</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/game-columns.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 class="h-display">🎟️ Tambola</h1>
        <div id="join-hint"></div>
      </header>

      <section id="join-panel" class="card">
        <h2>Scan to join</h2>
        <img id="join-qr" alt="Join QR code" />
        <div id="join-url"></div>
      </section>

      <section id="winners-panel" class="card hidden">
        <h2>🏆 Winners</h2>
        <ul id="winners-list"></ul>
      </section>

      <div class="col-row swap-on-mobile">
        <div class="col">
          <section id="board-panel" class="card">
            <h2>Numbers 1–90</h2>
            <div id="board-grid"></div>
          </section>
        </div>

        <div class="col">
          <section id="draw-panel" class="card">
            <div id="draw-status">Waiting to start…</div>
            <div id="current-draw"></div>
          </section>

          <section id="closing-in-panel" class="card hidden">
            <h2>🔥 Closing In</h2>
            <ul id="closing-in-list"></ul>
          </section>

          <section id="roster-panel" class="card">
            <h2>Players Joined (<span id="roster-count">0</span>)</h2>
            <ul id="roster-list"></ul>
          </section>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/confetti.js"></script>
    <script src="app.js"></script>
  </body>
</html>
