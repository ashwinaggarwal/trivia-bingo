<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambola — Admin</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 class="h-display">🎟️ Tambola — Admin</h1>
        <div id="game-title"></div>
      </header>

      <section id="join-panel" class="card">
        <h2>Players join this game</h2>
        <div id="join-body">
          <img id="join-qr" alt="Join QR code" />
          <div id="join-url"></div>
        </div>
        <div id="game-view-link">
          Game view (put this on the TV):
          <a id="game-view-url" href="#" target="_blank" rel="noopener"></a>
        </div>
      </section>

      <section id="status-panel" class="card">
        <div id="status-line">Loading…</div>
        <div id="current-draw"></div>
      </section>

      <section id="winners-panel" class="card hidden">
        <h2>🏆 Winners</h2>
        <ul id="winners-list"></ul>
      </section>

      <section id="controls" class="card">
        <button id="btn-start" class="btn-primary">Start Game</button>
        <button id="btn-draw">Draw Number</button>
        <button id="btn-redraw" class="btn-secondary">↺ Redraw Last Number</button>
        <button id="btn-mute" class="btn-secondary">🔇 Mute Sound For Everyone</button>
        <button id="btn-reset" class="btn-secondary">Reset Game</button>
      </section>

      <section id="players-panel" class="card">
        <h2>Players (<span id="player-count">0</span>)</h2>
        <ul id="players-list"></ul>
      </section>

      <section id="tickets-panel" class="card">
        <h2>Player Tickets</h2>
        <p class="hint">
          For verifying a claimed win — players can lie about what they've marked, this can't.
        </p>
        <div id="tickets-list"></div>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
