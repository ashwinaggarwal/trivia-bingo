<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fastest Finger — Game Screen</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/shared/game-columns.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="header-title" data-wrap="true">⚡ Fastest Finger ⚡</h1>
        <div id="join-hint"></div>
      </header>

      <section id="join-panel" class="card">
        <h2>Scan to join</h2>
        <img id="join-qr" alt="Join QR code" />
        <div id="join-url"></div>
      </section>

      <div class="col-row">
        <div class="col">
          <section id="question-panel" class="card">
            <div id="question-status">Waiting to start…</div>
            <div id="countdown-text" class="hidden"></div>
            <div id="question-text"></div>
            <img id="question-image" class="hidden" alt="" />
            <div id="ff-options" class="hidden"></div>
          </section>
        </div>

        <div class="col">
          <section id="arcade-leaderboard" class="card">
            <h2>🏆 Leaderboard</h2>
            <ol id="arcade-rows"></ol>
          </section>

          <section id="roster-panel" class="card">
            <h2>Players Joined (<span id="roster-count">0</span>)</h2>
            <ul id="roster-list" class="row-list row-list-wrap"></ul>
          </section>
        </div>
      </div>

      <footer id="flag-credit" class="hidden">
        Flag images courtesy of
        <a href="https://flagpedia.net" target="_blank" rel="noopener">flagpedia.net</a>
      </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/theme.js"></script>
    <script src="app.js"></script>
  </body>
</html>
