<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Night — Player</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1 class="h-display">🎉 Party Night</h1>
      </header>

      <section id="register-screen">
        <div id="game-id-banner"></div>
        <p>Enter your name to join the night:</p>
        <form id="register-form">
          <input id="name-input" type="text" placeholder="Your name" maxlength="40" required />
          <button type="submit" class="btn-primary">Join Party Night</button>
        </form>
        <p id="register-error" class="error"></p>
      </section>

      <section id="game-screen" class="hidden">
        <div id="player-name-banner"></div>
        <div id="score-banner"></div>

        <div id="round-banner" class="hidden">
          <div id="round-status">Round in progress</div>
          <div id="round-engine-name"></div>
          <a id="round-join-link" class="btn-primary" href="#">▶ Join This Round</a>
        </div>

        <div id="no-round-banner">Waiting for the host to start the next round…</div>

        <div id="rounds-history"></div>
      </section>

      <div id="celebration-overlay" class="hidden">
        <div id="celebration-title">🎊 Party Night is Over! 🎊</div>
        <div id="celebration-winner"></div>
        <div id="celebration-runnersup"></div>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/confetti.js"></script>
    <script src="app.js"></script>
  </body>
</html>
