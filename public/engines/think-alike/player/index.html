<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Think Alike — Player</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1 class="h-display">🧠 Think Alike</h1>
      </header>

      <section id="register-screen">
        <div id="game-id-banner"></div>
        <p>Enter your name to join:</p>
        <form id="register-form">
          <input id="name-input" type="text" placeholder="Your name" maxlength="40" required />
          <button type="submit" class="btn-primary">Join Game</button>
        </form>
        <p id="register-error" class="error"></p>
      </section>

      <section id="game-screen" class="hidden">
        <div id="player-name-banner"></div>
        <div id="score-banner"></div>

        <div id="prompt-banner" class="hidden">
          <div id="prompt-status"></div>
          <div id="prompt-text"></div>
        </div>

        <form id="answer-form" class="hidden">
          <input
            id="answer-input"
            type="text"
            placeholder="Your answer"
            maxlength="60"
            autocomplete="off"
          />
          <button type="submit" class="btn-primary">Submit</button>
        </form>
        <p id="answer-submitted" class="hidden">Answer submitted — waiting on everyone else…</p>

        <div id="reveal-panel" class="hidden"></div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
